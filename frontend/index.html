<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Race Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>F1 Race Predictor</h1>
        <p>Predict race finishing positions using practice, qualifying, weather, and historical data.</p>
    </header>

    <main>
        <section class="prediction-box">
            <label for="track">Select a race</label>
            <div class="controls">
                <input type="text" id="track" placeholder="e.g. Monaco">
                <button onclick="predictRace()">Predict Race</button>
            </div>
        </section>

        <section id="results" class="results"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
